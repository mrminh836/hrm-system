global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Node.js Express HRM Application
  - job_name: 'hrm-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['hrm-app:5000']
    relabel_configs:
      - target_label: application
        replacement: 'hrm-system'

  # 3. MySQL Database Exporter
  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['hrm-mysql-exporter:9104']
    relabel_configs:
      - target_label: service
        replacement: 'mysql-database'

  # 4. cAdvisor Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['hrm-cadvisor:8080']
    relabel_configs:
      - target_label: system
        replacement: 'docker-containers'
