<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý nhân viên - HRM Enterprise</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <main class="app-main">
      <header class="app-header">
        <div class="header-breadcrumbs">
          <span>Nhân sự</span>
          <span id="breadcrumb-sep"></span>
          <span class="current">Danh sách hồ sơ</span>
        </div>
        <div class="header-controls">
          <button class="btn btn-primary btn-sm" id="btn-open-create-modal">
            <span id="plus-icon-slot"></span>
            <span>Thêm nhân viên mới</span>
          </button>
        </div>
      </header>

      <div class="content-wrapper">
        <!-- Search & Filter Controls -->
        <div class="card" style="padding: 16px 20px; margin-bottom: 20px;">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px;">
            <div style="display: flex; gap: 12px; flex-wrap: wrap; flex: 1;">
              <div class="search-bar-wrap">
                <span id="search-icon-slot"></span>
                <input type="text" id="search-input" placeholder="Tìm theo tên, email, mã NV, SĐT...">
              </div>

              <div style="min-width: 200px;">
                <select id="department-filter" class="form-control">
                  <option value="">Tất cả phòng ban</option>
                </select>
              </div>

              <div style="min-width: 170px;">
                <select id="status-filter" class="form-control">
                  <option value="">Tất cả trạng thái</option>
                  <option value="active">Đang làm việc</option>
                  <option value="probation">Thử việc</option>
                  <option value="inactive">Tạm nghỉ</option>
                  <option value="resigned">Đã nghỉ việc</option>
                </select>
              </div>
            </div>

            <div style="display: flex; gap: 10px;">
              <button id="btn-search" class="btn btn-primary btn-sm">Tìm kiếm</button>
              <button id="btn-reset" class="btn btn-secondary btn-sm">Đặt lại</button>
            </div>
          </div>
        </div>

        <!-- Data Table Container -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Mã NV</th>
                  <th>Họ và tên</th>
                  <th>Liên hệ</th>
                  <th>Phòng ban</th>
                  <th>Vị trí</th>
                  <th>Lương cơ bản</th>
                  <th>Trạng thái</th>
                  <th style="text-align: right;">Thao tác</th>
                </tr>
              </thead>
              <tbody id="employees-tbody">
                <tr><td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">Đang tải danh sách nhân viên...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination Bar -->
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-top: 1px solid var(--border); background: #f8fafc;">
            <div style="font-size: 13px; color: var(--text-muted); font-weight: 500;" id="pagination-info">
              Hiển thị 0 / 0 nhân viên
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-secondary btn-sm" id="btn-prev-page" disabled>‹ Trước</button>
              <span id="page-indicator" style="display: flex; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 600; color: var(--text-primary);">
                Trang 1 / 1
              </span>
              <button class="btn btn-secondary btn-sm" id="btn-next-page" disabled>Sau ›</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Employee Modal -->
  <div class="modal-backdrop" id="employee-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title">Thêm nhân viên mới</h3>
        <button class="modal-close-btn" id="modal-close-btn"></button>
      </div>
      <form id="employee-form">
        <div class="modal-body">
          <input type="hidden" id="emp-id">

          <div class="form-group">
            <label class="form-label" for="emp-name">Họ và tên nhân viên <span style="color:red">*</span></label>
            <input type="text" id="emp-name" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="emp-email">Địa chỉ Email <span style="color:red">*</span></label>
              <input type="email" id="emp-email" class="form-control" placeholder="nguyenvana@hrm.local" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="emp-phone">Số điện thoại <span style="color:red">*</span></label>
              <input type="tel" id="emp-phone" class="form-control" placeholder="0988123456" required>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="emp-dob">Ngày sinh</label>
              <input type="date" id="emp-dob" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="emp-gender">Giới tính</label>
              <select id="emp-gender" class="form-control">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="emp-department">Phòng ban công tác</label>
              <select id="emp-department" class="form-control">
                <option value="">-- Chưa gán phòng ban --</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="emp-position">Vị trí / Chức danh</label>
              <input type="text" id="emp-position" class="form-control" placeholder="Kỹ sư phần mềm">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="emp-salary">Mức lương cơ bản (VNĐ)</label>
              <input type="number" id="emp-salary" class="form-control" placeholder="10000000" min="0" step="500000">
            </div>
            <div class="form-group">
              <label class="form-label" for="emp-status">Trạng thái công tác</label>
              <select id="emp-status" class="form-control">
                <option value="active">Đang làm việc</option>
                <option value="probation">Thử việc</option>
                <option value="inactive">Tạm nghỉ</option>
                <option value="resigned">Đã nghỉ việc</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="emp-address">Địa chỉ thường trú</label>
            <textarea id="emp-address" class="form-control" rows="2" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố"></textarea>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" id="modal-cancel-btn">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary" id="modal-save-btn">Lưu thông tin hồ sơ</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/icons.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    if (requireAuth()) {
      renderSidebar('employees');
      initEmployeePage();
    }

    // Inject icons
    document.getElementById('breadcrumb-sep').innerHTML = icons.chevronRight;
    document.getElementById('plus-icon-slot').innerHTML = icons.plus;
    document.getElementById('search-icon-slot').innerHTML = icons.search;
    document.getElementById('modal-close-btn').innerHTML = icons.x;

    let currentPage = 1;
    const limit = 10;
    let departmentsList = [];

    async function initEmployeePage() {
      await loadDepartments();
      await loadEmployees();
    }

    async function loadDepartments() {
      try {
        const res = await api.get('/departments');
        if (res.success) {
          departmentsList = res.data;
          const filterSelect = document.getElementById('department-filter');
          const formSelect = document.getElementById('emp-department');

          departmentsList.forEach(d => {
            filterSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
            formSelect.innerHTML += `<option value="${d.id}">${d.name}</option>`;
          });
        }
      } catch (err) {
        console.error('Failed to load departments', err);
      }
    }

    async function loadEmployees() {
      const search = document.getElementById('search-input').value;
      const department_id = document.getElementById('department-filter').value;
      const status = document.getElementById('status-filter').value;

      try {
        const queryParams = new URLSearchParams({
          page: currentPage,
          limit,
          search,
          department_id,
          status,
        });

        const res = await api.get(`/employees?${queryParams.toString()}`);
        if (res.success) {
          renderEmployeeTable(res.data);
        }
      } catch (err) {
        console.error('Failed to load employees', err);
      }
    }

    function renderEmployeeTable(data) {
      const tbody = document.getElementById('employees-tbody');
      const { items, total, page, totalPages } = data;

      document.getElementById('pagination-info').textContent = `Hiển thị ${items.length} trên tổng số ${total} nhân viên`;
      document.getElementById('page-indicator').textContent = `Trang ${page} / ${totalPages}`;
      document.getElementById('btn-prev-page').disabled = (page <= 1);
      document.getElementById('btn-next-page').disabled = (page >= totalPages);

      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 48px; color: var(--text-muted);">Không tìm thấy nhân viên nào phù hợp với bộ lọc.</td></tr>`;
        return;
      }

      const colors = ['color-1', 'color-2', 'color-3', 'color-4', 'color-5'];

      tbody.innerHTML = items.map((emp, idx) => {
        let statusClass = 'active';
        let statusText = 'Đang làm việc';
        if (emp.status === 'probation') { statusClass = 'probation'; statusText = 'Thử việc'; }
        if (emp.status === 'inactive') { statusClass = 'inactive'; statusText = 'Tạm nghỉ'; }
        if (emp.status === 'resigned') { statusClass = 'resigned'; statusText = 'Đã nghỉ việc'; }

        const initials = emp.full_name.split(' ').map(n => n[0]).slice(-2).join('').toUpperCase();
        const colorClass = colors[idx % colors.length];

        return `
          <tr>
            <td>
              <span style="font-weight: 700; font-size: 12.5px; color: var(--text-muted); background: #f1f5f9; padding: 4px 8px; border-radius: var(--radius-xs);">
                ${emp.employee_code}
              </span>
            </td>
            <td>
              <div class="user-cell">
                <div class="avatar-chip ${colorClass}">${initials}</div>
                <div class="user-cell-meta">
                  <a href="/pages/employee-detail.html?id=${emp.id}" class="user-cell-name" style="text-decoration: none;">
                    ${emp.full_name}
                  </a>
                  <div class="user-cell-sub">${emp.gender || 'Nam'} • ${formatDate(emp.date_of_birth)}</div>
                </div>
              </div>
            </td>
            <td>
              <div style="font-size: 13px; color: var(--text-primary); font-weight: 500;">${emp.email}</div>
              <div style="font-size: 11.5px; color: var(--text-muted);">${emp.phone}</div>
            </td>
            <td>
              <span style="font-weight: 600; color: var(--text-secondary);">${emp.department_name || '<em style="color:#94a3b8">Chưa gán</em>'}</span>
            </td>
            <td><span style="font-weight: 500;">${emp.position || '-'}</span></td>
            <td><strong style="color: #059669; font-size: 13.5px;">${formatCurrency(emp.salary)}</strong></td>
            <td>
              <div class="status-pill ${statusClass}">
                <div class="status-dot"></div>
                <span>${statusText}</span>
              </div>
            </td>
            <td style="text-align: right; white-space: nowrap;">
              <div style="display: inline-flex; gap: 6px;">
                <a href="/pages/employee-detail.html?id=${emp.id}" class="btn-icon" title="Xem hồ sơ">${icons.eye}</a>
                <button class="btn-icon btn-edit" data-id="${emp.id}" title="Chỉnh sửa">${icons.edit}</button>
                <button class="btn-icon danger btn-delete" data-id="${emp.id}" data-name="${emp.full_name}" title="Xóa nhân viên">${icons.trash}</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // Attach handlers
      document.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });

      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => handleDelete(btn.dataset.id, btn.dataset.name));
      });
    }

    // Modal logic
    const modalBackdrop = document.getElementById('employee-modal');
    const modalForm = document.getElementById('employee-form');

    function openModal() {
      modalBackdrop.classList.add('show');
    }

    function closeModal() {
      modalBackdrop.classList.remove('show');
      modalForm.reset();
      document.getElementById('emp-id').value = '';
    }

    document.getElementById('btn-open-create-modal').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Thêm nhân viên mới';
      document.getElementById('emp-id').value = '';
      modalForm.reset();
      openModal();
    });

    document.getElementById('modal-close-btn').addEventListener('click', closeModal);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);

    async function openEditModal(id) {
      try {
        const res = await api.get(`/employees/${id}`);
        if (res.success) {
          const emp = res.data;
          document.getElementById('modal-title').textContent = `Chỉnh sửa: ${emp.full_name}`;
          document.getElementById('emp-id').value = emp.id;
          document.getElementById('emp-name').value = emp.full_name;
          document.getElementById('emp-email').value = emp.email;
          document.getElementById('emp-phone').value = emp.phone;
          document.getElementById('emp-dob').value = emp.date_of_birth ? emp.date_of_birth.split('T')[0] : '';
          document.getElementById('emp-gender').value = emp.gender || 'Nam';
          document.getElementById('emp-department').value = emp.department_id || '';
          document.getElementById('emp-position').value = emp.position || '';
          document.getElementById('emp-salary').value = emp.salary || '';
          document.getElementById('emp-status').value = emp.status || 'active';
          document.getElementById('emp-address').value = emp.address || '';
          openModal();
        }
      } catch (err) {}
    }

    modalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('emp-id').value;
      const payload = {
        full_name: document.getElementById('emp-name').value.trim(),
        email: document.getElementById('emp-email').value.trim(),
        phone: document.getElementById('emp-phone').value.trim(),
        date_of_birth: document.getElementById('emp-dob').value || null,
        gender: document.getElementById('emp-gender').value,
        department_id: document.getElementById('emp-department').value || null,
        position: document.getElementById('emp-position').value.trim(),
        salary: parseFloat(document.getElementById('emp-salary').value) || 0,
        status: document.getElementById('emp-status').value,
        address: document.getElementById('emp-address').value.trim(),
      };

      try {
        if (id) {
          const res = await api.put(`/employees/${id}`, payload);
          showToast(res.message, 'success');
        } else {
          const res = await api.post('/employees', payload);
          showToast(res.message, 'success');
        }
        closeModal();
        loadEmployees();
      } catch (err) {}
    });

    async function handleDelete(id, name) {
      if (confirm(`Bạn có chắc chắn muốn xóa nhân viên "${name}" không? Thao tác này không thể hoàn tác.`)) {
        try {
          const res = await api.delete(`/employees/${id}`);
          showToast(res.message, 'success');
          loadEmployees();
        } catch (err) {}
      }
    }

    // Events
    document.getElementById('btn-search').addEventListener('click', () => {
      currentPage = 1;
      loadEmployees();
    });

    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        currentPage = 1;
        loadEmployees();
      }
    });

    document.getElementById('department-filter').addEventListener('change', () => {
      currentPage = 1;
      loadEmployees();
    });

    document.getElementById('status-filter').addEventListener('change', () => {
      currentPage = 1;
      loadEmployees();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('department-filter').value = '';
      document.getElementById('status-filter').value = '';
      currentPage = 1;
      loadEmployees();
    });

    document.getElementById('btn-prev-page').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadEmployees();
      }
    });

    document.getElementById('btn-next-page').addEventListener('click', () => {
      currentPage++;
      loadEmployees();
    });
  </script>
</body>
</html>
