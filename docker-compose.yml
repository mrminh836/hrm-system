services:
  # 1. MySQL Database Service
  hrm-mysql:
    image: mysql:8.0
    container_name: hrm-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hrm_root_secure_2026}
      MYSQL_DATABASE: ${DB_NAME:-hrm_db}
      MYSQL_USER: ${DB_USER:-hrm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hrm_secure_password_2026}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hrm-backend-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-hrm_root_secure_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. phpMyAdmin Database Management
  hrm-phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: hrm-phpmyadmin
    restart: unless-stopped
    depends_on:
      hrm-mysql:
        condition: service_healthy
    environment:
      PMA_HOST: hrm-mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-hrm_user}
      PMA_PASSWORD: ${DB_PASSWORD:-hrm_secure_password_2026}
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      - hrm-backend-net
      - hrm-frontend-net

  # 3. HRM Web Application (Node.js/Express + Static Frontend)
  hrm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrm-app
    restart: unless-stopped
    depends_on:
      hrm-mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: hrm-mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-hrm_user}
      DB_PASSWORD: ${DB_PASSWORD:-hrm_secure_password_2026}
      DB_NAME: ${DB_NAME:-hrm_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_hrm_2026_qminh}
      JWT_EXPIRES_IN: 7d
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hrm.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_NAME: ${ADMIN_NAME:-Đỗ Quang Minh (Admin)}
    ports:
      - "5000:5000"
    networks:
      - hrm-backend-net
      - hrm-frontend-net
      - hrm-monitoring-net

  # 4. Nginx Reverse Proxy with HTTPS & Security Headers (Sprint 2 US 16.0)
  hrm-nginx:
    image: nginx:alpine
    container_name: hrm-nginx
    restart: unless-stopped
    depends_on:
      - hrm-app
      - hrm-phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hrm-frontend-net

  # 5. MySQL Exporter (Sprint 2 US 17.0)
  hrm-mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: hrm-mysql-exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/my.cnf"
    volumes:
      - ./monitoring/mysql-exporter/.my.cnf:/etc/my.cnf:ro
    depends_on:
      hrm-mysql:
        condition: service_healthy
    ports:
      - "9104:9104"
    networks:
      - hrm-backend-net
      - hrm-monitoring-net

  # 6. cAdvisor Container Metrics (Sprint 2 US 17.0)
  hrm-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hrm-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - hrm-monitoring-net

  # 7. Prometheus Monitoring (Sprint 2 US 17.0)
  hrm-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hrm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - hrm-monitoring-net
      - hrm-frontend-net
      - hrm-backend-net

  # 8. Grafana Dashboard (Sprint 2 US 17.0 & US 18.0)
  hrm-grafana:
    image: grafana/grafana:10.4.0
    container_name: hrm-grafana
    restart: unless-stopped
    depends_on:
      - hrm-prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - hrm-monitoring-net

  # 9. Loki Centralized Logging (Sprint 2 US 18.0)
  hrm-loki:
    image: grafana/loki:2.9.4
    container_name: hrm-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    networks:
      - hrm-monitoring-net

  # 10. Promtail Log Shipper (Sprint 2 US 18.0)
  hrm-promtail:
    image: grafana/promtail:2.9.4
    container_name: hrm-promtail
    restart: unless-stopped
    depends_on:
      - hrm-loki
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hrm-monitoring-net

volumes:
  mysql_data:
    driver: local
  grafana_data:
    driver: local

networks:
  hrm-frontend-net:
    driver: bridge
  hrm-backend-net:
    driver: bridge
  hrm-monitoring-net:
    driver: bridge
